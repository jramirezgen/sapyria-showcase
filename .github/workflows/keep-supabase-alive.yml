name: Keep Supabase Alive

# Supabase pausa los proyectos del plan gratuito tras 7 días sin actividad de
# API. Este workflow hace una lectura mínima cada 3 días —margen de más del
# doble— para que el proyecto nunca llegue a ese umbral.
#
# Endpoint: GoTrue (/auth/v1/health), no PostgREST. Se probó primero contra
# /rest/v1/profiles con la clave pública y devolvió 401 "permission denied":
# RLS y GRANT son dos compuertas distintas (ver supabase/003_esquema_demo.sql)
# y `anon` no tiene GRANT SELECT en ninguna tabla — por diseño, no es un bug.
# /auth/v1/health sí requiere el header `apikey` pero no requiere permisos de
# tabla, siempre responde 200 y igual pasa por el mismo Postgres del proyecto
# (GoTrue usa el esquema `auth` de la misma base). Es la señal de actividad
# más limpia sin tocar ni exponer datos de negocio.
#
# La clave usada es la pública (`NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY`), la
# misma que ya viaja al navegador de cualquier visitante — no es secreta.

on:
  schedule:
    - cron: "0 9 */3 * *" # cada 3 días a las 09:00 UTC
  workflow_dispatch: {} # permite disparar una corrida manual para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping de salud a Supabase (GoTrue)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL o SUPABASE_ANON_KEY en el repositorio (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          http_status=$(curl -sS -o /tmp/respuesta.json -w "%{http_code}" \
            "${SUPABASE_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}")

          echo "HTTP status: ${http_status}"
          echo "Cuerpo de la respuesta:"
          cat /tmp/respuesta.json
          echo

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "::error::Supabase respondió con estado ${http_status}. El proyecto puede estar pausado o mal configurado."
            exit 1
          fi

          echo "OK: Supabase respondió ${http_status}. Actividad registrada en el proyecto."
