name: Keep Supabase Alive

# Supabase pausa los proyectos del plan gratuito tras 7 días sin actividad de
# API. Este workflow hace una lectura mínima cada 3 días —margen de más del
# doble— para que el proyecto nunca llegue a ese umbral.
#
# No usa `supabase status` ni el dashboard: llama directamente al mismo
# endpoint REST (PostgREST) que ya usa la app, con la clave pública
# (`NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY`, la misma que ya viaja al navegador
# de cualquier visitante — no es secreta). La tabla consultada no concede
# SELECT a `anon`, así que la respuesta esperada es 200 con una lista vacía:
# eso ya es un round-trip real contra Postgres, que es lo único que importa
# para que Supabase registre actividad. No se lee ni se expone ningún dato.

on:
  schedule:
    - cron: "0 9 */3 * *" # cada 3 días a las 09:00 UTC
  workflow_dispatch: {} # permite disparar una corrida manual para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al REST de Supabase (PostgREST)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL o SUPABASE_ANON_KEY en el repositorio (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          http_status=$(curl -sS -o /tmp/respuesta.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: ${http_status}"
          echo "Cuerpo de la respuesta:"
          cat /tmp/respuesta.json
          echo

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "::error::Supabase respondió con estado ${http_status}. El proyecto puede estar pausado o mal configurado."
            exit 1
          fi

          echo "OK: Supabase respondió ${http_status}. Actividad registrada en el proyecto."
